<svg id="autoToActiveOnce" width="159" height="159" viewBox="0 0 159 159" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Click works only while Auto is visible. After the first click it is disabled. -->
  <rect id="clickArea" x="0" y="0" width="159" height="159" fill="transparent" pointer-events="all">
    <set attributeName="pointer-events" begin="clickArea.click" to="none" fill="freeze" />
  </rect>

  <!-- ACTIVE icon: sercle.svg (white rounded square) спинится внутрь -->
  <g id="activeIcon" opacity="0" pointer-events="none">
    <animate
      attributeName="opacity"
      begin="clickArea.click+0.06s"
      dur="0.21s"
      values="0;0;1"
      keyTimes="0;0.22;1"
      calcMode="spline"
      keySplines="0 0 1 1;0.2 0.8 0.2 1"
      fill="freeze" />

    <g transform="translate(79.5 79.5)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        begin="clickArea.click"
        dur="0.40s"
        values="-82;4;0"
        keyTimes="0;0.72;1"
        calcMode="spline"
        keySplines="0.16 0.78 0.22 1;0.25 0 0.18 1"
        additive="sum"
        fill="freeze" />

      <g>
        <animateTransform
          attributeName="transform"
          type="scale"
          begin="clickArea.click+0.03s"
          dur="0.23s"
          values="0.28;1.015;1"
          keyTimes="0;0.74;1"
          calcMode="spline"
          keySplines="0.18 0.86 0.2 1;0.22 0 0.2 1"
          fill="freeze" />

        <g transform="translate(-59 -59)">
          <!-- sercle.svg: rect 28.75×28.75 rx=2.5, масштабирован до 103×103 (×3.583) -->
          <g transform="translate(7.5 7.5) scale(3.583)">
            <rect width="28.75" height="28.75" rx="2.5" fill="#F2FDFF"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- AUTO icon: стандартная иконка автоспина, крутится наружу при активации -->
  <g id="autoIcon" opacity="1" pointer-events="none">
    <animate
      attributeName="opacity"
      begin="clickArea.click"
      dur="0.23s"
      values="1;1;0"
      keyTimes="0;0.22;1"
      calcMode="spline"
      keySplines="0 0 1 1;0.24 0.78 0.18 1"
      fill="freeze" />

    <g transform="translate(79.5 79.5)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        begin="clickArea.click"
        dur="0.40s"
        values="0;-17;360"
        keyTimes="0;0.11;1"
        calcMode="spline"
        keySplines="0.55 0 0.85 0.22;0.16 0.86 0.18 1"
        additive="sum"
        fill="freeze" />

      <g>
        <animateTransform
          attributeName="transform"
          type="scale"
          begin="clickArea.click"
          dur="0.21s"
          values="1;0.32"
          keyTimes="0;1"
          calcMode="spline"
          keySplines="0.22 0.9 0.18 1"
          fill="freeze" />

        <!-- autoplay_icon.svg пути, масштабированы ×2.3 и центрированы (viewBox 61×64) -->
