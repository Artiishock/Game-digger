<svg width="62" height="72" viewBox="0 0 62 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hit-shape {
      fill: transparent;
      pointer-events: visiblePainted;
      cursor: pointer;
    }

    .state {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity;
      pointer-events: none;
    }

    .state-default { opacity: 1; }
    .state-hover,
    .state-pushed { opacity: 0; }

    .hit-shape:hover ~ .state-default { opacity: 0; }
    .hit-shape:hover ~ .state-hover { opacity: 1; }
    .hit-shape:hover ~ .state-pushed { opacity: 0; }

    .hit-shape:active ~ .state-default,
    .hit-shape:active ~ .state-hover { opacity: 0; }
    .hit-shape:active ~ .state-pushed { opacity: 1; }
  </style>

